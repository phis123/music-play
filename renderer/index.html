<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>music-play</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="titlebar">
  <div class="tb-drag"></div>
  <div class="tb-btns">
    <button data-win="min" title="最小化">─</button>
    <button data-win="max" title="最大化">☐</button>
    <button data-win="close" class="danger" title="关闭">✕</button>
  </div>
</header>

<div id="shell">
  <aside id="sidebar">
    <div class="side-head">
      <span class="brand">music-play</span>
      <button id="btnPickFolder" title="选择音乐文件夹">📁</button>
    </div>
    <div class="side-scroll">
      <nav class="nav-group">
        <div class="group-label">发现</div>
        <a class="nav-item" data-route="#/home"><span class="ico">🏠</span><span>首页</span></a>
      </nav>
      <nav class="nav-group">
        <div class="group-label">我的</div>
        <a class="nav-item" data-route="#/liked"><span class="ico">♥</span><span>我喜欢的音乐</span></a>
        <a class="nav-item" data-route="#/recent"><span class="ico">🕘</span><span>最近播放</span></a>
        <a class="nav-item" data-route="#/local"><span class="ico">💾</span><span>本地音乐</span></a>
      </nav>
      <nav class="nav-group">
        <div class="group-label">歌单 <button id="btnNewPlaylist" title="新建歌单">＋</button></div>
        <div id="plList"></div>
      </nav>
    </div>
  </aside>

  <main id="content"><div id="view"></div></main>

  <!-- 歌词独立页 -->
  <section id="lyricsPage" class="overlay hidden">
    <div class="lp-head">
      <button id="lpBack" title="返回（Esc）">←</button>
      <span class="lp-head-title">歌词</span>
      <span class="off-group">
        <button id="offDown" title="歌词提前 0.1 秒（快捷键 [）">−</button>
        <span id="lpOff" class="chip" title="歌词延迟偏移">偏移 0.0s</span>
        <button id="offUp" title="歌词延后 0.1 秒（快捷键 ]）">＋</button>
      </span>
      <span id="lpSrc" class="chip">—</span>
    </div>
    <div class="lp-body">
      <div class="lp-left">
        <div class="lp-cover" id="lpCover"></div>
        <div class="lp-title" id="lpTitle">—</div>
        <div class="lp-artist" id="lpArtist">—</div>
      </div>
      <div class="lp-right">
        <div id="lpLyrics"></div>
        <div id="lpEmpty" class="empty-note hidden">没有歌词</div>
        <button id="lpResume" class="hidden" title="回到正在播放的歌词">回到当前</button>
      </div>
    </div>
  </section>
</div>

<footer id="playerbar">
  <div class="pb-left" id="pbInfo" title="点击查看歌词">
    <div class="pb-cover" id="pbCover"></div>
    <div class="pb-meta">
      <div class="pb-title" id="pbTitle">未在播放</div>
      <div class="pb-artist" id="pbArtist">—</div>
    </div>
  </div>

  <div class="pb-center">
    <div class="pb-controls">
      <button id="pbPrev" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="5.5" width="2.6" height="13" rx="1.3"/>
          <path d="M19 5.9v12.2a.9.9 0 0 1-1.4.75L8.6 12.75a.9.9 0 0 1 0-1.5l9-6.1A.9.9 0 0 1 19 5.9z"/>
        </svg>
      </button>
      <button id="pbPlay" class="primary" title="播放/暂停" aria-label="播放/暂停"></button>
      <button id="pbNext" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="16.4" y="5.5" width="2.6" height="13" rx="1.3"/>
          <path d="M5 5.9v12.2a.9.9 0 0 0 1.4.75l9-6.1a.9.9 0 0 0 0-1.5l-9-6.1A.9.9 0 0 0 5 5.9z"/>
        </svg>
      </button>
    </div>
    <div class="pb-progress">
      <span id="pbCur">0:00</span>
      <input id="pbSeek" type="range" min="0" max="1000" value="0">
      <span id="pbDur">0:00</span>
    </div>
  </div>

  <div class="pb-right">
    <button id="pbFav" title="喜欢">♥</button>
    <button id="pbAdd" title="加入歌单">＋</button>
    <button id="pbLyrics" title="歌词">词</button>
    <button id="pbFloat" title="悬浮歌词（桌面歌词）">浮</button>
    <button id="pbVol" title="音量">🔊</button>
    <span id="pbVer" class="dim"></span>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <audio id="previewAudio" preload="none"></audio>
</footer>

<script src="js/app.js"></script>
</body>
</html>
