<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music-play</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <div class="brand">music-play</div>
      <button id="btnFolder" title="选择文件夹">📁</button>
    </div>
    <div id="status">准备中…</div>
    <div id="list"></div>
  </aside>

  <main id="main">
    <section id="now">
      <div id="cover" class="cover"></div>
      <div class="meta">
        <div id="title">未在播放</div>
        <div id="artist"></div>
        <div class="badges">
          <span id="lyricsSrc" class="badge">—</span>
          <span id="clock" class="badge">0:00 / 0:00</span>
        </div>
      </div>
    </section>

    <section id="lyricsWrap">
      <div id="lyrics"></div>
      <div id="empty" class="empty">没有歌词</div>
    </section>

    <footer id="bar">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      <div class="controls">
        <button id="btnPrev">⏮</button>
        <button id="btnPlay" class="primary">▶</button>
        <button id="btnNext">⏭</button>
        <span id="ver" class="dim"></span>
      </div>
    </footer>
    <audio id="audio" preload="metadata"></audio>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
