<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; media-src 'self' file: blob: data: https: http:; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafafa" id="metaThemeColor">
<title>music-play</title>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<!-- 统一 24×24 光学网格 SVG 图标库（stroke-width 1.75 线性体系 + 播放核心实心图标） -->
<svg id="svgSprites" class="svg-sprites" aria-hidden="true">
  <defs>
    <!-- 导航与通用 -->
    <symbol id="ico-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 10.6 12 3.8l8.5 6.8"/>
      <path d="M5.5 9.2V19a1.5 1.5 0 0 0 1.5 1.5h10A1.5 1.5 0 0 0 18.5 19V9.2"/>
      <path d="M9.75 20.5v-5.25a2.25 2.25 0 0 1 4.5 0v5.25"/>
    </symbol>
    <symbol id="ico-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.2" r="3.7"/>
      <path d="M4.8 19.8c.9-3.4 3.7-5.3 7.2-5.3s6.3 1.9 7.2 5.3"/>
    </symbol>
    <symbol id="ico-disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <circle cx="12" cy="12" r="2.6"/>
      <path d="M12 6.5a5.5 5.5 0 0 1 4.8 2.8"/>
    </symbol>
    <symbol id="ico-heart" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20s-7.4-4.5-7.4-9.7A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.4 2.9C19.4 15.5 12 20 12 20z"/>
    </symbol>
    <symbol id="ico-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.4V12l3.2 2"/>
    </symbol>
    <symbol id="ico-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.5h11.5M4 11.5h11.5M4 16.5h7.5"/>
      <circle cx="17.2" cy="16.5" r="2.3"/>
      <path d="M19.5 16.5V8.5l2.5-.7"/>
    </symbol>
    <symbol id="ico-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4.2v10.6"/>
      <path d="M8.2 11.2 12 15l3.8-3.8"/>
      <path d="M4.5 18.8h15"/>
    </symbol>
    <symbol id="ico-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h4m4 0h8M4 12h10m4 0h2M4 17h6m4 0h6"/>
      <circle cx="10" cy="7" r="2"/>
      <circle cx="16" cy="12" r="2"/>
      <circle cx="12" cy="17" r="2"/>
    </symbol>
    <symbol id="ico-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.76l.05.05a1.9 1.9 0 1 1-2.68 2.68l-.05-.05a1.6 1.6 0 0 0-1.76-.32 1.6 1.6 0 0 0-.96 1.46v.14a1.9 1.9 0 1 1-3.8 0v-.08a1.6 1.6 0 0 0-1.04-1.46 1.6 1.6 0 0 0-1.76.32l-.05.05a1.9 1.9 0 1 1-2.68-2.68l.05-.05a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.46-.96h-.14a1.9 1.9 0 1 1 0-3.8h.08a1.6 1.6 0 0 0 1.46-1.04 1.6 1.6 0 0 0-.32-1.76l-.05-.05a1.9 1.9 0 1 1 2.68-2.68l.05.05a1.6 1.6 0 0 0 1.76.32h.08a1.6 1.6 0 0 0 .96-1.46v-.14a1.9 1.9 0 1 1 3.8 0v.08a1.6 1.6 0 0 0 .96 1.46 1.6 1.6 0 0 0 1.76-.32l.05-.05a1.9 1.9 0 1 1 2.68 2.68l-.05.05a1.6 1.6 0 0 0-.32 1.76v.08a1.6 1.6 0 0 0 1.46.96h.14a1.9 1.9 0 1 1 0 3.8h-.08a1.6 1.6 0 0 0-1.46.96z"/>
    </symbol>

    <!-- 动作与方向 -->
    <symbol id="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round">
      <circle cx="10.8" cy="10.8" r="6.3"/>
      <path d="m15.6 15.6 4.4 4.4"/>
    </symbol>
    <symbol id="ico-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5.5 8.5 12 15 18.5"/>
    </symbol>
    <symbol id="ico-chev-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 9.5 12 15l5.5-5.5"/>
    </symbol>
    <symbol id="ico-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 6 15.5 12 9.5 18"/>
    </symbol>
    <symbol id="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
    </symbol>
    <symbol id="ico-qnext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h9M4 12h9M4 17h6"/>
      <path d="M16.5 11v6M13.5 14h6"/>
    </symbol>
    <symbol id="ico-pladd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M12 5.5v13M5.5 12h13"/>
    </symbol>
    <symbol id="ico-plrm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
    </symbol>
    <symbol id="ico-del" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 7h15"/>
      <path d="M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2"/>
      <path d="M6.6 7l.8 11.8a1.4 1.4 0 0 0 1.4 1.2h6.4a1.4 1.4 0 0 0 1.4-1.2L17.4 7"/>
      <path d="M10.3 11v5.5M13.7 11v5.5"/>
    </symbol>
    <symbol id="ico-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11a8 8 0 0 0-14.4-4.8L4 8"/>
      <path d="M4 4v4h4"/>
      <path d="M4 13a8 8 0 0 0 14.4 4.8L20 16"/>
      <path d="M20 20v-4h-4"/>
    </symbol>
    <symbol id="ico-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 7.5a2 2 0 0 1 2-2h4.2l2 2.2h6.8a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
    </symbol>
    <symbol id="ico-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 5 6.3v5.4c0 4.6 3 7.8 7 9.3 4-1.5 7-4.7 7-9.3V6.3z"/>
      <path d="m9.2 12 2 2 3.8-4"/>
    </symbol>
    <symbol id="ico-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 3.6 18.8a1.2 1.2 0 0 0 1 1.7h14.8a1.2 1.2 0 0 0 1-1.7z"/>
      <path d="M12 9.5v4.5M12 17h.01"/>
    </symbol>

    <!-- 播放与音频控制 -->
    <symbol id="ico-play" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8.4 5.7v12.6a.95.95 0 0 0 1.46.8l9.8-6.3a.95.95 0 0 0 0-1.6l-9.8-6.3a.95.95 0 0 0-1.46.8z"/>
    </symbol>
    <symbol id="ico-pause" viewBox="0 0 24 24" fill="currentColor">
      <rect x="6.8" y="5.2" width="3.6" height="13.6" rx="1.4"/>
      <rect x="13.6" y="5.2" width="3.6" height="13.6" rx="1.4"/>
    </symbol>
    <symbol id="ico-prev" viewBox="0 0 24 24" fill="currentColor">
      <rect x="5" y="5.4" width="2.5" height="13.2" rx="1.25"/>
      <path d="M18.6 5.9v12.2a.85.85 0 0 1-1.32.71l-8.4-6.1a.85.85 0 0 1 0-1.42l8.4-6.1a.85.85 0 0 1 1.32.71z"/>
    </symbol>
    <symbol id="ico-next" viewBox="0 0 24 24" fill="currentColor">
      <path d="M5.4 5.9v12.2a.85.85 0 0 0 1.32.71l8.4-6.1a.85.85 0 0 0 0-1.42l-8.4-6.1a.85.85 0 0 0-1.32.71z"/>
      <rect x="16.5" y="5.4" width="2.5" height="13.2" rx="1.25"/>
    </symbol>
    <symbol id="ico-queue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.5h15.5M4 11.5h15.5M4 16.5h9"/>
      <path d="m16.5 14.5 3.8 2.2-3.8 2.2z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ico-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 7h3.2c1.8 0 3 .9 4.2 2.6l2.2 3.2c1.2 1.7 2.4 2.7 4.2 2.7h3.2"/>
      <path d="m17.8 12.8 2.7 2.7-2.7 2.7"/>
      <path d="M3.5 15.5h3.2c1.2 0 2.2-.4 3-1.3"/>
      <path d="M13.6 9.3c1-1.4 2.1-2.3 3.7-2.3h3.2"/>
      <path d="m17.8 4.3 2.7 2.7-2.7 2.7"/>
    </symbol>
    <symbol id="ico-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 3.8 20.5 6.8l-3 3"/>
      <path d="M4 11.5v-1.2A3.5 3.5 0 0 1 7.5 6.8h13"/>
      <path d="M6.5 20.2 3.5 17.2l3-3"/>
      <path d="M20 12.5v1.2a3.5 3.5 0 0 1-3.5 3.5h-13"/>
    </symbol>
    <symbol id="ico-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4l4 4-4 4"/>
      <path d="M4 8h16"/>
      <path d="M8 20l-4-4 4-4"/>
      <path d="M20 16H4"/>
    </symbol>
    <symbol id="ico-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round">
      <path d="M4 10v4M8 7v10M12 4.5v15M16 7.5v9M20 10.5v3"/>
    </symbol>
    <symbol id="ico-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5a8.5 8.5 0 1 0 0 17h1.4a2.2 2.2 0 0 0 1.6-3.7 1.8 1.8 0 0 1 1.3-3h1.5a2.7 2.7 0 0 0 2.7-2.7c0-4.2-3.8-7.6-8.5-7.6z"/>
      <circle cx="7.8" cy="10.2" r="1" fill="currentColor"/>
      <circle cx="10.8" cy="7.5" r="1" fill="currentColor"/>
      <circle cx="14.8" cy="8" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ico-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 14 9l5.5 2-5.5 2-2 5.5-2-5.5-5.5-2L10 9z"/>
    </symbol>
    <symbol id="ico-health" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12h3.8l2.2-5.5 4 11 2.2-5.5h4.8"/>
    </symbol>
    <symbol id="ico-float" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/>
      <path d="M7.5 10.5h9M9 14h6"/>
    </symbol>
    <symbol id="ico-diag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
      <path d="m8 10 2.5 2.2L8 14.5M12.5 14.5h3.5"/>
    </symbol>
    <symbol id="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6z"/>
      <circle cx="12" cy="12" r="2.6"/>
    </symbol>
    <symbol id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.8v2M12 19.2v2M4.8 4.8l1.4 1.4M17.8 17.8l1.4 1.4M2.8 12h2M19.2 12h2M4.8 19.2l1.4-1.4M17.8 6.2l1.4-1.4"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <!-- 平板横屏侧栏（≥900dp） -->
  <aside id="rail" class="rail">
    <div class="rail-brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="rail-logo">music-play</span>
    </div>
    <div class="rail-group-label">探索</div>
    <nav class="rail-nav">
      <button class="rail-item" data-tab="home">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-home"/></svg>
        <span>首页</span>
      </button>
      <button class="rail-item" data-tab="me">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-user"/></svg>
        <span>个人中心</span>
      </button>
    </nav>
    <div class="rail-group-label">我的曲库</div>
    <nav class="rail-nav">
      <button class="rail-item" data-go="local">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-disc"/></svg>
        <span>本地音乐</span>
      </button>
      <button class="rail-item" data-go="liked">
        <svg class="ico" viewBox="0 0 24 24" fill="none"><use href="#ico-heart"/></svg>
        <span>我喜欢的音乐</span>
      </button>
      <button class="rail-item" data-go="recent">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-clock"/></svg>
        <span>最近播放</span>
      </button>
      <button class="rail-item" data-go="playlists">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-playlist"/></svg>
        <span>歌单</span>
      </button>
    </nav>
    <div class="rail-group-label">工具</div>
    <nav class="rail-nav">
      <button class="rail-item" data-go="import">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-download"/></svg>
        <span>批量导入</span>
      </button>
      <button class="rail-item" data-go="settings">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-settings"/></svg>
        <span>设置</span>
      </button>
    </nav>
    <div class="rail-foot">
      <button class="rail-theme-btn" id="railThemeBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24"><use href="#ico-sun"/></svg>
        <span id="railThemeLabel">外观：浅色</span>
      </button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main id="main">
    <div id="taskBanner" class="task-banner hidden"></div>
    <div id="view"></div>

    <!-- 悬浮 Mini 播放胶囊 -->
    <div id="mini" class="mini hidden" data-np="1">
      <div class="mini-cover" id="miniCover"></div>
      <div class="mini-meta">
        <div class="mini-title" id="miniTitle">未在播放</div>
        <div class="mini-artist" id="miniArtist">—</div>
      </div>
      <div class="mini-ctrls">
        <button class="mini-btn mini-play-btn" id="miniPlay" aria-label="播放/暂停">
          <svg viewBox="0 0 24 24" id="miniIcon"><path d="M8.4 5.7v12.6a.95.95 0 0 0 1.46.8l9.8-6.3a.95.95 0 0 0 0-1.6l-9.8-6.3a.95.95 0 0 0-1.46.8z"/></svg>
        </button>
        <button class="mini-btn" id="miniNext" aria-label="下一首">
          <svg viewBox="0 0 24 24"><use href="#ico-next"/></svg>
        </button>
        <button class="mini-btn" id="miniQueue" aria-label="播放队列">
          <svg viewBox="0 0 24 24"><use href="#ico-queue"/></svg>
        </button>
      </div>
      <div class="mini-bar"><div class="mini-bar-in" id="miniBar"></div></div>
    </div>
  </main>

  <!-- 手机与平板竖屏底部导航（<900dp） -->
  <nav id="tabs" class="tabs">
    <button class="tab active" data-tab="home">
      <span class="tab-ico"><svg viewBox="0 0 24 24"><use href="#ico-home"/></svg></span>
      <span>首页</span>
    </button>
    <button class="tab" data-tab="me">
      <span class="tab-ico"><svg viewBox="0 0 24 24"><use href="#ico-user"/></svg></span>
      <span>我的</span>
    </button>
    <button class="tab" data-go="settings">
      <span class="tab-ico"><svg viewBox="0 0 24 24"><use href="#ico-settings"/></svg></span>
      <span>设置</span>
    </button>
  </nav>
</div>

<!-- 全屏播放页（唱盘 + 双语歌词） -->
<div id="np" class="np hidden">
  <div class="np-bg" id="npBg"></div>
  <div class="np-veil"></div>

  <header class="np-head">
    <button class="np-icon-btn np-back" id="npBack" aria-label="收起播放页">
      <svg viewBox="0 0 24 24"><use href="#ico-chev-down"/></svg>
    </button>
    <div class="np-head-center">
      <div class="np-headtitle" id="npHeadTitle">正在播放</div>
      <div class="np-headsub" id="npHeadSub">本地曲库</div>
    </div>
    <div class="np-head-right">
      <button class="np-pill-chip" id="npGainChip" title="当前生效音量平衡补偿">均衡 0.0dB</button>
      <button class="np-icon-btn" id="npGearBtn" aria-label="播放设置" title="单曲声音平衡 / 歌词延迟 / 悬浮歌词">
        <svg viewBox="0 0 24 24"><use href="#ico-settings"/></svg>
      </button>
    </div>
  </header>

  <div class="np-body">
    <div class="np-stage-wrap">
      <div class="np-stage">
        <div class="np-disc"><div class="np-cover" id="npCover"></div></div>
      </div>
      <div class="np-peek" id="npPeek" role="button" tabindex="0" aria-label="展开双语歌词">
        <div class="np-peek-main" id="npPeekMain">轻点唱片查看双语歌词</div>
        <div class="np-peek-sub" id="npPeekSub"></div>
      </div>
      <div class="np-hint">轻点唱片切换歌词视图</div>
    </div>
    <div class="np-lyrics-wrap">
      <div class="np-lyrics" id="npLyrics"><div class="np-empty">没有歌词</div></div>
      <button class="np-resume hidden" id="npResume" type="button">回到当前句</button>
    </div>
  </div>

  <footer class="np-foot">
    <div class="np-meta-bar">
      <div class="np-meta-text">
        <div class="np-title" id="npTitle">—</div>
        <div class="np-artist" id="npArtist">—</div>
      </div>
      <div class="np-actions">
        <button class="np-act-btn" id="npFav" aria-label="喜欢" title="喜欢">
          <svg viewBox="0 0 24 24" id="npFavIcon" fill="none"><use href="#ico-heart"/></svg>
        </button>
        <button class="np-act-btn np-source-btn" id="npSource" aria-label="更换声源" title="更换当前歌曲声源">
          <svg viewBox="0 0 24 24"><use href="#ico-swap"/></svg>
          <span>换源</span>
        </button>
        <button class="np-act-btn" id="npAddPl" aria-label="加入歌单" title="加入歌单">
          <svg viewBox="0 0 24 24"><use href="#ico-pladd"/></svg>
        </button>
        <button class="np-act-btn" id="npMiniSetBtn" aria-label="本曲调音与歌词设置" title="单曲声音平衡 / 歌词延迟 / 悬浮歌词">
          <svg viewBox="0 0 24 24"><use href="#ico-sliders"/></svg>
        </button>
      </div>
    </div>

    <div class="np-seek">
      <span id="npCur">0:00</span>
      <input type="range" id="npRange" min="0" max="1000" value="0">
      <span id="npDur">0:00</span>
    </div>

    <div class="np-ctrl">
      <button id="npShuffle" aria-label="播放模式" title="切换播放模式">
        <svg viewBox="0 0 24 24" id="npModeIcon" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 3.8 20.5 6.8l-3 3"/><path d="M4 11.5v-1.2A3.5 3.5 0 0 1 7.5 6.8h13"/><path d="M6.5 20.2 3.5 17.2l3-3"/><path d="M20 12.5v1.2a3.5 3.5 0 0 1-3.5 3.5h-13"/></svg>
      </button>
      <button id="npPrev" aria-label="上一首"><svg viewBox="0 0 24 24"><use href="#ico-prev"/></svg></button>
      <button id="npPlay" class="np-play" aria-label="播放/暂停"><svg viewBox="0 0 24 24" id="npIcon"><path d="M8.4 5.7v12.6a.95.95 0 0 0 1.46.8l9.8-6.3a.95.95 0 0 0 0-1.6l-9.8-6.3a.95.95 0 0 0-1.46.8z"/></svg></button>
      <button id="npNext" aria-label="下一首"><svg viewBox="0 0 24 24"><use href="#ico-next"/></svg></button>
      <button id="npQueue" aria-label="播放队列" title="当前播放队列">
        <svg viewBox="0 0 24 24"><use href="#ico-queue"/></svg>
        <span class="np-q-badge" id="npQueueCount"></span>
      </button>
    </div>
  </footer>
</div>
